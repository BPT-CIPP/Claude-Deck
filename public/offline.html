<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Deck isn't running</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1b222c; color: #e4e9f0; font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    main { max-width: 520px; padding: 32px 24px; }
    img { width: 56px; height: 56px; }
    h1 { font: 600 22px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; margin: 16px 0 8px; }
    p { color: #9aa6b6; margin: 0 0 12px; }
    code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; color: #e4e9f0; }
    a.button { display: inline-block; margin-top: 8px; padding: 7px 14px; border-radius: 6px; background: #e9edf3; color: #17202b; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Claude Deck isn't running</h1>
    <p>The dashboard needs its local server. Start it with the <strong>Start Claude Deck</strong> shortcut, or run <code>Start-ClaudeDeck.ps1</code>, then try again.</p>
    <p>To have it ready whenever you sign in to Windows, turn on <strong>Start with Windows</strong> under Claude Deck Preferences.</p>
    <a class="button" href="/">Try again</a>
  </main>
</body>
</html>
